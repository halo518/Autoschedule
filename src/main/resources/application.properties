spring.application.name=MoneyBug

# ==========================================
# MySQL DB ?? ??
# ==========================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/moneybug?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=1234

# ==========================================
# JPA(Hibernate) ??
# ==========================================
# update: Entity ???? DB ???? ???? ????? ???????.
spring.jpa.hibernate.ddl-auto=update

# ?? ?? JPA? ???? SQL ???? ?? ?? ??? ?? ?????.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# JPA 쿼리 파라미터(?)에 들어가는 실제 값을 콘솔에 출력합니다.
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ==========================================
# JWT (values come from environment variables)
# ==========================================

# HS256 secret, at least 32 bytes
jwt.secret=${JWT_SECRET}
jwt.access-ttl-seconds=1800
jwt.refresh-ttl-seconds=1209600

# HTTPS 로 배포할 때만 true (로컬 http 개발은 false)
auth.cookie-secure=${COOKIE_SECURE:false}


# Gemini (AI schedule generation). Key stays server-side only.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash,gemini-2.5-flash,gemini-3.5-flash-lite}
gemini.timeout-seconds=150
