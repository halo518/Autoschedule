spring.application.name=MoneyBug

# ==========================================
# MySQL DB ?? ??
# ==========================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/moneybug?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=1234

# ==========================================
# JPA(Hibernate) ??
# ==========================================
# update: Entity ???? DB ???? ???? ????? ???????.
spring.jpa.hibernate.ddl-auto=update

# ?? ?? JPA? ???? SQL ???? ?? ?? ??? ?? ?????.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# JPA 쿼리 파라미터(?)에 들어가는 실제 값을 콘솔에 출력합니다.
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ==========================================
# Kakao / JWT (values come from environment variables)
# ==========================================
kakao.rest-api-key=${KAKAO_REST_API_KEY:}
kakao.client-secret=${KAKAO_CLIENT_SECRET:}
kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:8080/api/auth/kakao/callback}
# optional: if set, mobile tokens issued for other Kakao apps are rejected
kakao.app-id=${KAKAO_APP_ID:}

# HS256 secret, at least 32 bytes
jwt.secret=${JWT_SECRET}
jwt.access-ttl-seconds=1800
jwt.refresh-ttl-seconds=1209600
